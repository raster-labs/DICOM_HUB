spring:
  datasource:
    url: jdbc:h2:mem:dicomhub_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

hub:
  role: all
  default-site-id: 11111111-1111-1111-1111-111111111111
  storage:
    root-dir: ./target/test-storage
  dicom-scp:
    enabled: false
    ae-title: DICOMHUB_AE
    bind-host: 127.0.0.1
    port: 0
  crypto:
    pseudonym-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
