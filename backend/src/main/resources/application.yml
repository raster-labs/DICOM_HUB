spring:
  application:
    name: dicom-hub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dicomhub}
    username: ${SPRING_DATASOURCE_USERNAME:dicomhub}
    password: ${SPRING_DATASOURCE_PASSWORD:dicomhub_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

hub:
  role: ${HUB_ROLE:all}
  default-site-id: ${HUB_DEFAULT_SITE_ID:11111111-1111-1111-1111-111111111111}
  storage:
    root-dir: ${HUB_STORAGE_ROOT:./storage}
  dicom-scp:
    enabled: ${HUB_DICOM_SCP_ENABLED:true}
    ae-title: ${HUB_DICOM_AE_TITLE:DICOMHUB_AE}
    bind-host: ${HUB_DICOM_BIND_HOST:0.0.0.0}
    port: ${HUB_DICOM_PORT:11112}
  crypto:
    # 32-byte Base64 AES-256 key (override in production via HUB_PSEUDONYM_AES_KEY_B64)
    pseudonym-key-base64: ${HUB_PSEUDONYM_AES_KEY_B64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
