# =============================================================================
# DICOM Hub – On-Premise Docker Compose Architecture (Specification Section 7)
# Dedicated persistent volumes separate Original DICOM Repository from
# Vendor Working Copies, AI Results, and PostgreSQL operational data.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: dicomhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dicomhub}
      POSTGRES_USER: ${POSTGRES_USER:-dicomhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dicomhub_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dicomhub} -d ${POSTGRES_DB:-dicomhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend
    container_name: dicomhub-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUB_ROLE: backend-api
      HUB_DICOM_SCP_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dicomhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dicomhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dicomhub_secret}
      HUB_STORAGE_ROOT: /var/dicomhub/storage
      HUB_PSEUDONYM_AES_KEY_B64: ${HUB_PSEUDONYM_AES_KEY_B64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    ports:
      - "8080:8080"
    volumes:
      - dicom_original_repo:/var/dicomhub/storage/original-repo
      - dicom_working_copies:/var/dicomhub/storage/working-copies
      - dicom_ai_results:/var/dicomhub/storage/ai-results

  dicom-receiver:
    build:
      context: ./backend
    container_name: dicomhub-dicom-receiver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUB_ROLE: dicom-receiver
      HUB_DICOM_SCP_ENABLED: "true"
      HUB_DICOM_AE_TITLE: ${HUB_DICOM_AE_TITLE:-DICOMHUB_AE}
      HUB_DICOM_PORT: "11112"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dicomhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dicomhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dicomhub_secret}
      HUB_STORAGE_ROOT: /var/dicomhub/storage
      HUB_PSEUDONYM_AES_KEY_B64: ${HUB_PSEUDONYM_AES_KEY_B64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    ports:
      - "11112:11112"
    volumes:
      - dicom_original_repo:/var/dicomhub/storage/original-repo
      - dicom_working_copies:/var/dicomhub/storage/working-copies
      - dicom_ai_results:/var/dicomhub/storage/ai-results

  queue-worker:
    build:
      context: ./backend
    container_name: dicomhub-queue-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUB_ROLE: queue-worker
      HUB_DICOM_SCP_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dicomhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dicomhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dicomhub_secret}
      HUB_STORAGE_ROOT: /var/dicomhub/storage
      HUB_PSEUDONYM_AES_KEY_B64: ${HUB_PSEUDONYM_AES_KEY_B64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    volumes:
      - dicom_original_repo:/var/dicomhub/storage/original-repo:ro
      - dicom_working_copies:/var/dicomhub/storage/working-copies
      - dicom_ai_results:/var/dicomhub/storage/ai-results

  result-receiver:
    build:
      context: ./backend
    container_name: dicomhub-result-receiver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUB_ROLE: result-receiver
      HUB_DICOM_SCP_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dicomhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dicomhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dicomhub_secret}
      HUB_STORAGE_ROOT: /var/dicomhub/storage
      HUB_PSEUDONYM_AES_KEY_B64: ${HUB_PSEUDONYM_AES_KEY_B64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    volumes:
      - dicom_ai_results:/var/dicomhub/storage/ai-results

  cleanup-worker:
    build:
      context: ./backend
    container_name: dicomhub-cleanup-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUB_ROLE: cleanup-worker
      HUB_DICOM_SCP_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dicomhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dicomhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dicomhub_secret}
      HUB_STORAGE_ROOT: /var/dicomhub/storage
    volumes:
      - dicom_working_copies:/var/dicomhub/storage/working-copies

  web-frontend:
    build:
      context: ./frontend
    container_name: dicomhub-web-frontend
    restart: unless-stopped
    depends_on:
      - backend-api

  nginx:
    image: nginx:1.27-alpine
    container_name: dicomhub-nginx
    restart: unless-stopped
    depends_on:
      - web-frontend
      - backend-api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  dicom_original_repo:
  dicom_working_copies:
  dicom_ai_results:
