# =============================================================================
# DICOM Hub – Streamlined Production Docker Deployment (Hospital Server)
# Runs PostgreSQL 16, DICOM Hub Backend (API + DICOM SCP + Workers),
# Angular 19 Command Centre UI, and Nginx Reverse Proxy with isolated volumes
# for Original DICOM Repository, Vendor Working Copies, and AI Results.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: dicomhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dicomhub}
      POSTGRES_USER: ${POSTGRES_USER:-dicomhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dicomhub_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dicomhub} -d ${POSTGRES_DB:-dicomhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    image: ${BACKEND_IMAGE:-ghcr.io/raster-labs/dicomhub-backend}:${APP_VERSION:-latest}
    build:
      context: ./backend
    container_name: dicomhub-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUB_ROLE: ${HUB_ROLE:-all}
      HUB_DEFAULT_SITE_ID: ${HUB_DEFAULT_SITE_ID:-11111111-1111-1111-1111-111111111111}
      HUB_DICOM_SCP_ENABLED: ${HUB_DICOM_SCP_ENABLED:-true}
      HUB_DICOM_AE_TITLE: ${HUB_DICOM_AE_TITLE:-DICOMHUB_AE}
      HUB_DICOM_BIND_HOST: 0.0.0.0
      HUB_DICOM_PORT: "11112"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dicomhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dicomhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dicomhub_secret}
      HUB_STORAGE_ROOT: /var/dicomhub/storage
      HUB_PSEUDONYM_AES_KEY_B64: ${HUB_PSEUDONYM_AES_KEY_B64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${HUB_DICOM_PORT:-11112}:11112"
    volumes:
      - dicom_original_repo:/var/dicomhub/storage/original-repo
      - dicom_working_copies:/var/dicomhub/storage/working-copies
      - dicom_ai_results:/var/dicomhub/storage/ai-results

  web-frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/raster-labs/dicomhub-frontend}:${APP_VERSION:-latest}
    build:
      context: ./frontend
    container_name: dicomhub-web-frontend
    restart: unless-stopped
    depends_on:
      - backend-api

  nginx:
    image: nginx:1.27-alpine
    container_name: dicomhub-nginx
    restart: unless-stopped
    depends_on:
      - web-frontend
      - backend-api
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  dicom_original_repo:
  dicom_working_copies:
  dicom_ai_results:
